apiVersion: 1

contactPoints:
  - orgId: 1
    name: Discord Alerts
    receivers:
      - uid: discord-receiver
        type: discord
        settings:
          url: ${DISCORD_WEBHOOK_URL}
          message: |
            🚨 **{{ .CommonLabels.alertname }}**
            📌 Status: **{{ .Status | toUpper }}**
            🕐 Time: {{ .CommonAnnotations.summary }}
            {{ range .Alerts }}
            • {{ .Annotations.description }}
            {{ end }}

policies:
  - orgId: 1
    receiver: Discord Alerts
    group_by: ['alertname', 'container']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h

rules:
  - orgId: 1
    name: Container Alerts
    folder: Sentinel
    interval: 1m
    rules:
      - uid: container-down
        title: Container Down
        condition: A
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: absent(container_last_seen{name=~"sentinel-.*|mock-.*"})
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: Alerting
        execErrState: Alerting
        for: 30s
        annotations:
          summary: "Container has disappeared"
          description: "A container is no longer visible to cAdvisor"
        labels:
          severity: critical

      - uid: high-cpu
        title: High CPU Usage
        condition: A
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: rate(container_cpu_usage_seconds_total{name=~"sentinel-.*|mock-.*"}[5m]) * 100 > 80
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: OK
        execErrState: Alerting
        for: 2m
        annotations:
          summary: "CPU usage above 80%"
          description: "Container {{ $labels.name }} CPU is at {{ $value }}%"
        labels:
          severity: warning

      - uid: high-memory
        title: High Memory Usage
        condition: A
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: (container_memory_usage_bytes{name=~"sentinel-.*|mock-.*"} / container_spec_memory_limit_bytes{name=~"sentinel-.*|mock-.*"}) * 100 > 80
              intervalMs: 1000
              maxDataPoints: 43200
        noDataState: OK
        execErrState: Alerting
        for: 2m
        annotations:
          summary: "Memory usage above 80%"
          description: "Container {{ $labels.name }} memory is at {{ $value }}%"
        labels:
          severity: warning
